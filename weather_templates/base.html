<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-section input {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ecf0f1;
            border-radius: 10px;
            font-family: inherit;
        }

        .search-section input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-section button {
            padding: 12px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .search-section button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .search-section button:active {
            transform: translateY(0);
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .error.show {
            display: block;
        }

        .weather-section {
            display: none;
        }

        .weather-section.show {
            display: block;
        }

        .current-weather {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            text-align: center;
        }

        .location {
            font-size: 20px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .temp-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .weather-icon {
            font-size: 60px;
        }

        .temperature {
            font-size: 48px;
            font-weight: bold;
        }

        .condition {
            font-size: 18px;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .detail-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .detail-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 18px;
            font-weight: bold;
        }

        .forecast-title {
            font-size: 20px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }

        .forecast-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #ecf0f1;
            transition: all 0.2s;
        }

        .forecast-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-3px);
            border-color: #667eea;
        }

        .forecast-date {
            font-size: 12px;
            color: #999;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .forecast-icon {
            font-size: 36px;
            margin: 8px 0;
        }

        .forecast-temps {
            font-size: 14px;
            margin: 8px 0;
            color: #333;
        }

        .forecast-temps .high {
            font-weight: bold;
            color: #e74c3c;
        }

        .forecast-temps .low {
            color: #3498db;
        }

        .forecast-condition {
            font-size: 12px;
            color: #666;
            text-transform: capitalize;
            margin-top: 8px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .loading.show {
            display: block;
        }

        .loading::after {
            content: ' ...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '';
            }
            40% {
                content: '.';
            }
            60% {
                content: '..';
            }
            80%, 100% {
                content: '...';
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .search-section {
                flex-direction: column;
            }

            .temp-display {
                flex-direction: column;
                gap: 10px;
            }

            .weather-icon {
                font-size: 50px;
            }

            .temperature {
                font-size: 36px;
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather App</h1>

        <div class="search-section">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name (e.g., London, New York, Tokyo)" 
                onkeypress="if(event.key === 'Enter') searchWeather()"
            />
            <button onclick="searchWeather()">Search</button>
        </div>

        <div class="error" id="error"></div>
        <div class="loading" id="loading"></div>

        <div class="weather-section" id="weatherSection">
            <div class="current-weather">
                <div class="location" id="location"></div>
                <div class="temp-display">
                    <div class="weather-icon" id="currentIcon"></div>
                    <div class="temperature" id="temperature"></div>
                </div>
                <div class="condition" id="condition"></div>
                <div class="weather-details">
                    <div class="detail-item">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value" id="feelsLike"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value" id="humidity"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value" id="windSpeed"></div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value" id="pressure"></div>
                    </div>
                </div>
            </div>

            <div class="forecast-title">5-Day Forecast</div>
            <div class="forecast-grid" id="forecastGrid"></div>
        </div>
    </div>

    <script>
        const cityInput = document.getElementById('cityInput');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');
        const weatherSection = document.getElementById('weatherSection');

        function searchWeather() {
            const city = cityInput.value.trim();

            if (!city) {
                showError('Please enter a city name');
                return;
            }

            // Clear previous state
            errorDiv.classList.remove('show');
            weatherSection.classList.remove('show');
            loadingDiv.classList.add('show');

            // Fetch weather data
            fetch('/weather', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ city: city })
            })
            .then(response => response.json())
            .then(data => {
                loadingDiv.classList.remove('show');

                if (data.error) {
                    showError(data.error);
                    return;
                }

                displayWeather(data);
            })
            .catch(error => {
                loadingDiv.classList.remove('show');
                showError('Network error: ' + error.message);
            });
        }

        function showError(message) {
            errorDiv.textContent = '❌ ' + message;
            errorDiv.classList.add('show');
            weatherSection.classList.remove('show');
        }

        function displayWeather(data) {
            const current = data.current;
            const forecast = data.forecast;

            // Update current weather
            document.getElementById('location').textContent = `${current.city}, ${current.country}`;
            document.getElementById('currentIcon').textContent = current.icon;
            document.getElementById('temperature').textContent = `${current.temperature}°F`;
            document.getElementById('condition').textContent = current.description;
            document.getElementById('feelsLike').textContent = `${current.feels_like}°F`;
            document.getElementById('humidity').textContent = `${current.humidity}%`;
            document.getElementById('windSpeed').textContent = `${current.wind_speed} m/s`;
            document.getElementById('pressure').textContent = `${current.pressure} hPa`;

            // Update forecast
            const forecastGrid = document.getElementById('forecastGrid');
            forecastGrid.innerHTML = '';

            forecast.forEach(day => {
                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <div class="forecast-date">${day.date}</div>
                    <div class="forecast-icon">${day.icon}</div>
                    <div class="forecast-temps">
                        <span class="high">${day.temp_max}°F</span> / 
                        <span class="low">${day.temp_min}°F</span>
                    </div>
                    <div class="forecast-condition">${day.description}</div>
                `;
                forecastGrid.appendChild(card);
            });

            weatherSection.classList.add('show');
            errorDiv.classList.remove('show');
        }

        // Focus on input on load
        cityInput.focus();
    </script>
</body>
</html>
